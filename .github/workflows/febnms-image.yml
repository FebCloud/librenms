name: FebNMS image

on:
  workflow_dispatch:
    inputs:
      librenms_version:
        description: Official LibreNMS image tag to build on
        required: true
        default: 26.11.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The image holds the files changed since the release, so the diff needs history.
          fetch-depth: 0
      - name: Collect the files changed since the release
        run: docker/febnms/build-context.sh "${{ inputs.librenms_version }}"
      - name: Short revision
        id: rev
        run: echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/febnms
          build-args: |
            LIBRENMS_VERSION=${{ inputs.librenms_version }}
            FORK_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/febcloud/febnms-librenms:${{ inputs.librenms_version }}
            ghcr.io/febcloud/febnms-librenms:${{ inputs.librenms_version }}-${{ steps.rev.outputs.short }}
            ghcr.io/febcloud/febnms-librenms:latest
